name: Track prices

on:
  schedule:
    # Runs at minute 17 every 6 hours (odd minute avoids GitHub's busy top-of-hour queue)
    - cron: "17 */6 * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab
    inputs:
      debug:
        description: "Log page title/body snippet for options where no price was found (for diagnosing a blocked/changed site)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape.py
        env:
          SCRAPE_DEBUG: ${{ inputs.debug && '1' || '' }}

      - name: Commit updated price data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update price data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
